name: CI

on:
  pull_request:
    branches: [main, balance/yellow-legacy-port]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Audit trainer data
        run: |
          python -m unittest discover -s tools/audit -p "test_*.py" -v
          python tools/audit/trainers.py --baseline docs/trainer-manifest.json

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build

      - name: Build
        run: make -j"$(nproc)"

      - name: Check for modified tracked files
        run: |
          if ! git diff-index --quiet HEAD --; then
            echo 'Uncommitted changes detected:'
            git diff-index HEAD --
            exit 1
          fi

      - name: Stage release files
        run: |
          mkdir release
          cp pokeyellow.gbc       release/pokemon-yellow.gbc
          cp pokeyellow.map       release/pokemon-yellow.map
          cp pokeyellow.sym       release/pokemon-yellow.sym
          cp pokeyellow_debug.gbc release/pokemon-yellow-debug.gbc
          cp pokeyellow_debug.map release/pokemon-yellow-debug.map
          cp pokeyellow_debug.sym release/pokemon-yellow-debug.sym

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pokemon-yellow-build
          path: release/
          if-no-files-found: error
          retention-days: 3

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/rom_tests/requirements.txt

      - name: Install ROM test dependencies
        run: python -m pip install -r tools/rom_tests/requirements.txt

      - name: Run unit tests
        run: python -m pytest tools/rom_tests/tests/unit

  e2e:
    name: E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: pokemon-yellow-build
          path: release

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/rom_tests/requirements.txt

      - name: Install ROM test dependencies
        run: python -m pip install -r tools/rom_tests/requirements.txt

      - name: Run end-to-end tests
        env:
          ROM_TEST_ROM: release/pokemon-yellow-debug.gbc
          ROM_TEST_SYMBOLS: release/pokemon-yellow-debug.sym
        run: python -m pytest tools/rom_tests/tests/e2e

      - name: Upload end-to-end test failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rom-test-failures
          path: test-results/
          if-no-files-found: ignore
