name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build

      - name: Build
        run: make -j"$(nproc)"

      - name: Check for modified tracked files
        run: |
          if ! git diff-index --quiet HEAD --; then
            echo 'Uncommitted changes detected:'
            git diff-index HEAD --
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ROM test dependencies
        run: python -m pip install pyboy==2.7.0 pillow pytest

      - name: Run ROM tests
        run: python -m pytest tools/rom_tests/tests

      - name: Upload ROM test failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rom-test-failures
          path: test-results/
          if-no-files-found: ignore

      - name: Stage release files
        if: github.event_name == 'push'
        run: |
          mkdir release
          cp pokeyellow.gbc       release/pokemon-yellow.gbc
          cp pokeyellow.map       release/pokemon-yellow.map
          cp pokeyellow.sym       release/pokemon-yellow.sym
          cp pokeyellow_debug.gbc release/pokemon-yellow-debug.gbc
          cp pokeyellow_debug.map release/pokemon-yellow-debug.map
          cp pokeyellow_debug.sym release/pokemon-yellow-debug.sym

      - name: Upload build artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: pokemon-yellow-build
          path: release/
          if-no-files-found: error
          retention-days: 3
